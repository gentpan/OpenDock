name: Bug report / 报告问题
description: Something doesn't work as expected / 有功能不正常
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please search the existing issues first —
        if it's already there, add your details to that one.
        **English or Chinese are both fine.**

        感谢反馈。提交前请先搜一下已有的 issue，已经有人报过的话，在那条下面补充就好。
        **中文英文都可以。**

  - type: input
    id: app-version
    attributes:
      label: OpenDock version / OpenDock 版本
      description: >
        Menu bar icon ▸ Settings… ▸ About — the version is on the first row.
        / 菜单栏图标 ▸ 设置… ▸ 关于，版本号在第一行。
      placeholder: "0.18.2 (42)"
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version / 系统版本
      description: >
        Apple menu ▸ About This Mac.
        / 苹果菜单 ▸ 关于本机。
      placeholder: "macOS 15.6 (Apple Silicon)"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      description: >
        What did you do, step by step? If it only happens with a specific app,
        please name it — window behaviour varies a lot between apps.
        / 你是怎么一步步操作的？如果只在某个应用上出现，请写明是哪个——不同应用的窗口行为差别很大。
      placeholder: |
        1. Open two Finder windows
        2. Minimize the front one
        3. Click its item in the taskbar
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected / 期望的结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened / 实际的结果
      description: >
        A screenshot or short screen recording helps a lot for anything visual.
        / 视觉上的问题，附一张截图或一小段录屏会很有帮助。
    validations:
      required: true

  - type: dropdown
    id: accessibility
    attributes:
      label: Accessibility permission / 辅助功能权限
      description: >
        System Settings ▸ Privacy & Security ▸ Accessibility.
        / 系统设置 ▸ 隐私与安全性 ▸ 辅助功能。
      options:
        - "Granted / 已授权"
        - "Not granted / 未授权"
        - "Not sure / 不确定"
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic info / 诊断信息
      description: >
        Settings ▸ About ▸ Diagnostic Info ▸ Copy, then paste it here. It holds versions,
        Mac model, display setup and appearance settings.
        / 设置 ▸ 关于 ▸ 诊断信息 ▸ 拷贝，然后粘贴到这里。内容是版本、Mac 型号、显示器配置和外观设置。
      render: text
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else / 其他补充
      description: >
        Does it happen every time or only sometimes? Did it start after an update?
        / 每次都出现还是偶发？是不是某次更新之后才开始的？
    validations:
      required: false
